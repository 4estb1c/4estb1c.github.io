<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inspector</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="reader-page">
  <header class="reader-header"><a class="wordmark" href="./">Inspector</a><span class="header-divider"></span><a href="./" class="back-link">Library</a><button class="mobile-notes" id="mobile-notes" aria-expanded="false">Commentary <span id="note-total"></span></button></header>
  <div id="reader-status" class="reader-status" aria-live="polite">Opening document…</div>
  <main id="reader" hidden><section class="article-intro"><p class="eyebrow" id="article-kicker"></p><h1 id="article-title"></h1><p class="dek" id="article-dek"></p><div class="byline" id="article-meta"></div><div class="document-tools"><a id="source-link" target="_blank" rel="noopener">Original work ↗</a><a id="context-link" download>Research context ↓</a><button id="copy-prompt">Copy Codex prompt</button></div><p id="edition-note" class="edition-note"></p></section>
    <nav class="chapter-nav" aria-label="Chapters"><span>Contents</span><ol id="chapter-list"></ol></nav>
    <div id="original-column" class="reading-grid" aria-label="Article text with research commentary"><div class="column-headings"><div class="original-heading"><p class="margin-title" id="original-column-title">The argument</p></div><div class="margin-heading"><p class="margin-title" id="margin-column-title">In the margin</p><p class="margin-subtitle">Updated evidence &amp; context</p></div></div><div id="reader-rows" class="reader-rows"></div></div>
  </main>
  <template id="toast-template"><div class="toast" role="status">Prompt copied.</div></template>
  <script src="charts.js" defer></script><script src="app.js" defer></script>
</body>
</html>
